<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 270" font-family="system-ui, -apple-system, sans-serif" font-size="14">
  <title>Wall joins: mitre, butt, around a point</title>
  <style>
    .a { fill: #4c8bf5; fill-opacity: .35; }
    .b { fill: #f59e0b; fill-opacity: .35; }
    .c { fill: #10b981; fill-opacity: .35; }
    polygon { stroke: #7a7a7a; stroke-width: 1.25; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
    polyline { fill: none; stroke: #7a7a7a; stroke-width: 1; stroke-dasharray: 4 3; vector-effect: non-scaling-stroke; }
    text { fill: #8a8a8a; text-anchor: middle; }
  </style>

  <!-- Coordinates in metres, y up; each group maps 1 m to 70 px. -->
  <g transform="translate(40 200) scale(70 -70)">
    <polygon class="a" points="0,-0.19 2.69,-0.19 2.31,0.19 0,0.19"/>
    <polygon class="b" points="2.69,-0.19 2.69,2 2.31,2 2.31,0.19"/>
    <polyline points="0,0 2.5,0 2.5,2"/>
  </g>
  <text x="134" y="242">Mitre: two ends at one point</text>

  <g transform="translate(320 200) scale(70 -70)">
    <polygon class="a" points="0,-0.19 3,-0.19 3,0.19 0,0.19"/>
    <polygon class="b" points="1.56,0.19 1.56,2 1.44,2 1.44,0.19"/>
    <polyline points="0,0 3,0"/>
    <polyline points="1.5,0 1.5,2"/>
  </g>
  <text x="425" y="242">Butt: end inside another wall</text>

  <g transform="translate(690 200) scale(70 -70)">
    <polygon class="a" points="-0.19,0.19 -1.5,0.19 -1.5,-0.19 0,-0.19 0,0"/>
    <polygon class="b" points="0.19,0.19 0.19,1.8 -0.19,1.8 -0.19,0.19 0,0"/>
    <polygon class="c" points="0,-0.19 1.5,-0.19 1.5,0.19 0.19,0.19 0,0"/>
    <polyline points="-1.5,0 1.5,0"/>
    <polyline points="0,0 0,1.8"/>
  </g>
  <text x="690" y="242">Around a point: three or more ends</text>
  <text x="420" y="264" font-size="12">dashed: location line as drawn · fill: outline returned by join_walls</text>
</svg>
