name: Release

# A tag vMAJOR.MINOR.PATCH on main builds the signed APK and publishes it with update.json,
# which installed apps read to update themselves (docs/adr/0018, docs/releasing.md).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      # Keep the toolchain in step with the android job of ci.yml.
      NDK: "30.0.16248370"
      SDK_CMAKE: "4.1.2"
      VCPKG_ROOT: ${{ github.workspace }}/../vcpkg
      VCPKG_TAG: "2026.10.16"
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag and its notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
          jq -e '.notes.ru | length > 0' "release-notes/$version.json" > /dev/null \
            || { echo "::error::android/release-notes/$version.json needs notes in Russian"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Install NDK and CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK" "cmake;$SDK_CMAKE" > /dev/null

      - name: Install vcpkg
        run: |
          git clone --depth 1 --branch "$VCPKG_TAG" https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          # The tool comes from GitHub releases, which sometimes answer 504 for a minute.
          for attempt in 1 2 3 4; do
            "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics && break
            [ "$attempt" -eq 4 ] && exit 1
            sleep 30
          done

      - uses: actions/cache@v6
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-android-${{ runner.os }}-${{ hashFiles('engine/vcpkg.json', 'engine/vcpkg-configuration.json', 'engine/ports/**') }}

      - uses: gradle/actions/setup-gradle@v6

      - name: Format, build, unit tests, lint, sign
        env:
          KEYSTORE_BASE64: ${{ secrets.OTVES_KEYSTORE_BASE64 }}
          OTVES_KEYSTORE: ${{ runner.temp }}/otves.jks
          OTVES_KEYSTORE_PASSWORD: ${{ secrets.OTVES_KEYSTORE_PASSWORD }}
          OTVES_KEY_ALIAS: ${{ secrets.OTVES_KEY_ALIAS }}
          OTVES_KEY_PASSWORD: ${{ secrets.OTVES_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$OTVES_KEYSTORE"
          ./gradlew spotlessCheck build -Potves.version="$VERSION"
          rm "$OTVES_KEYSTORE"

      # An APK signed with another key cannot replace the installed app, so it must never be published.
      - name: Check the APK's key and version
        env:
          EXPECTED_CERT: ${{ vars.OTVES_CERT_SHA256 }}
        run: |
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          apk=app/build/outputs/apk/release/app-release.apk
          # The words before the digest differ between apksigner versions ("Signer #1", "V2 Signer:").
          cert="$("$tools/apksigner" verify --print-certs "$apk" | awk '/certificate SHA-256 digest:/ { print $NF; exit }')"
          if [ -z "$EXPECTED_CERT" ] || [ "$cert" != "$EXPECTED_CERT" ]; then
            echo "::error::signed with '$cert', the repository variable OTVES_CERT_SHA256 says '$EXPECTED_CERT'"
            exit 1
          fi
          badging="$("$tools/aapt2" dump badging "$apk" | head -1)"
          name="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<< "$badging")"
          [ "$name" = "$VERSION" ] || { echo "::error::the APK is version '$name'"; exit 1; }
          echo "VERSION_CODE=$(sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" <<< "$badging")" >> "$GITHUB_ENV"

      - name: Write the release files
        run: |
          out="$RUNNER_TEMP/release"
          apk="otves-$VERSION.apk"
          mkdir -p "$out"
          cp app/build/outputs/apk/release/app-release.apk "$out/$apk"
          jq -n \
            --argjson code "$VERSION_CODE" \
            --arg name "$VERSION" \
            --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$apk" \
            --arg sha "$(sha256sum "$out/$apk" | cut -d' ' -f1)" \
            --argjson size "$(stat -c %s "$out/$apk")" \
            --slurpfile notes "release-notes/$VERSION.json" \
            '{schema: 1, versionCode: $code, versionName: $name, apk: {url: $url, sha256: $sha, size: $size}, notes: $notes[0].notes}' \
            > "$out/update.json"
          (cd "$out" && sha256sum "$apk" update.json > SHA256SUMS)

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ runner.temp }}/release/otves-*.apk

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/release/* \
            --verify-tag --generate-notes --title "Otves $VERSION"
