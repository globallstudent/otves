name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: ubuntu-24.04
    env:
      LLVM: "23"
      CMAKE: "4.4.5"
      VCPKG_ROOT: ${{ github.workspace }}/../vcpkg
      VCPKG_TAG: "2026.10.16"
    steps:
      - uses: actions/checkout@v7

      - name: Install CMake
        run: |
          curl -sSL "https://github.com/Kitware/CMake/releases/download/v$CMAKE/cmake-$CMAKE-linux-x86_64.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/cmake-$CMAKE-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Install LLVM and Ninja
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- "$LLVM" all
          sudo apt-get install -y ninja-build
          echo "CC=clang-$LLVM" >> "$GITHUB_ENV"
          echo "CXX=clang++-$LLVM" >> "$GITHUB_ENV"

      - name: Install vcpkg
        run: |
          git clone --depth 1 --branch "$VCPKG_TAG" https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - uses: actions/cache@v6
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('engine/vcpkg.json') }}

      - name: Format
        run: find engine -path '*/build' -prune -o \( -name '*.h' -o -name '*.cpp' \) -print | xargs "clang-format-$LLVM" --dry-run --Werror

      - name: Build and test with ASan + UBSan
        working-directory: engine
        run: |
          cmake --preset desktop-asan
          cmake --build --preset desktop-asan
          ctest --preset desktop-asan

      - name: clang-tidy
        working-directory: engine
        run: "run-clang-tidy-$LLVM -p build/desktop-asan -quiet"

      - name: Build and test with TSan
        working-directory: engine
        run: |
          cmake --preset desktop-tsan
          cmake --build --preset desktop-tsan
          ctest --preset desktop-tsan

  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      - name: Format, build, unit tests, lint
        run: ./gradlew spotlessCheck build
